name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Validate Configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw 'Missing GitHub Secret: TAILSCALE_AUTH_KEY'
          }

          Write-Host 'Configuration validated.'

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Write-Host 'RDP enabled with Network Level Authentication.'

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $existingUser = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name 'RDP'
          }

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]](33..47) + [char[]](58..64)
          }

          $passwordChars = @()
          $passwordChars += $charSet.Upper | Get-Random -Count 4
          $passwordChars += $charSet.Lower | Get-Random -Count 4
          $passwordChars += $charSet.Number | Get-Random -Count 4
          $passwordChars += $charSet.Special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser `
            -Name 'RDP' `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP'

          if (-not (Get-LocalUser -Name 'RDP')) {
              throw 'Failed to create the RDP user.'
          }

          "RDP_USERNAME=RDP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RDP_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host 'RDP user created successfully.'

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installerPath = Join-Path $env:RUNNER_TEMP 'tailscale-setup.msi'

          Write-Host "Downloading Tailscale installer..."

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          if (-not (Test-Path -LiteralPath $installerPath)) {
              throw 'Tailscale installer download failed.'
          }

          $install = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              "`"$installerPath`"",
              '/qn',
              '/norestart'
            ) `
            -Wait `
            -PassThru

          Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue

          if ($install.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed with exit code $($install.ExitCode)."
          }

          $tailscaleExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path -LiteralPath $tailscaleExe)) {
              throw "Tailscale executable not found: $tailscaleExe"
          }

          Write-Host 'Tailscale installed successfully.'

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tailscaleExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          & $tailscaleExe up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed with exit code $LASTEXITCODE."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
              $result = & $tailscaleExe ip -4 2>$null

              if ($LASTEXITCODE -eq 0 -and $result) {
                  $candidate = ($result | Select-Object -First 1).Trim()

                  if ($candidate -match '^100\.') {
                      $tsIP = $candidate
                      break
                  }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              & $tailscaleExe status
              throw 'Tailscale did not assign a valid IPv4 address.'
          }

          "TAILSCALE_IP=$tsIP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected: $tsIP"

      - name: Verify RDP Service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name TermService

          if ($service.Status -ne 'Running') {
              Start-Service -Name TermService
          }

          $listener = Get-NetTCPConnection `
            -State Listen `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw 'RDP is not listening on TCP port 3389.'
          }

          Write-Host 'RDP service is listening on port 3389.'
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      - name: Publish RDP Connection Details
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $summary = @"
          ## Windows RDP

          - **Tailscale IP:** $env:TAILSCALE_IP
          - **Username:** $env:RDP_USERNAME
          - **Port:** 3389

          Connect only from a device authorized on the same Tailscale network.
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          Write-Host 'RDP endpoint published in the workflow summary.'
          Write-Host 'The password is intentionally not printed in the logs.'

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host 'RDP session is running.'
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host 'Use the GitHub workflow run to monitor the session.'

          while ($true) {
              Start-Sleep -Seconds 60
          }
