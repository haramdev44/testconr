name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Validate Configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw 'Missing secret: TAILSCALE_AUTH_KEY'
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw 'Missing secret: RDP_PASSWORD'
          }

          if ($env:RDP_PASSWORD.Length -lt 16) {
              throw 'RDP_PASSWORD must contain at least 16 characters.'
          }

          Write-Host 'Configuration validated.'

      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Write-Host 'RDP enabled with NLA.'

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser `
            -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser `
                -Name 'RDP' `
                -Password $securePassword
          }
          else {
              New-LocalUser `
                -Name 'RDP' `
                -Password $securePassword `
                -AccountNeverExpires
          }

          # Allow RDP login.
          $rdpGroup = Get-LocalGroup -SID 'S-1-5-32-555'

          $rdpMembers = Get-LocalGroupMember `
            -Group $rdpGroup.Name `
            -ErrorAction SilentlyContinue

          if (-not ($rdpMembers | Where-Object {
              $_.Name -match '\\RDP$'
          })) {
              Add-LocalGroupMember `
                -Group $rdpGroup.Name `
                -Member 'RDP'
          }

          # Grant local administrator privileges.
          $adminGroup = Get-LocalGroup -SID 'S-1-5-32-544'

          $adminMembers = Get-LocalGroupMember `
            -Group $adminGroup.Name `
            -ErrorAction SilentlyContinue

          if (-not ($adminMembers | Where-Object {
              $_.Name -match '\\RDP$'
          })) {
              Add-LocalGroupMember `
                -Group $adminGroup.Name `
                -Member 'RDP'
          }

          # Verify membership.
          $adminMembers = Get-LocalGroupMember `
            -Group $adminGroup.Name

          if (-not ($adminMembers | Where-Object {
              $_.Name -match '\\RDP$'
          })) {
              throw 'Failed to grant administrator privileges to RDP.'
          }

          Write-Host 'RDP user configured successfully.'
          Write-Host 'Administrator membership verified.'

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'tailscale-setup.msi'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path -LiteralPath $installer)) {
              throw 'Tailscale installer download failed.'
          }

          $process = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              "`"$installer`"",
              '/qn',
              '/norestart'
            ) `
            -Wait `
            -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed: $($process.ExitCode)"
          }

          $exe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path -LiteralPath $exe)) {
              throw 'Tailscale executable not found.'
          }

          Write-Host 'Tailscale installed.'

      - name: Connect to Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $hostname = "gh-rdp-$env:GITHUB_RUN_ID"

          & $exe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed: $LASTEXITCODE"
          }

          $ip = $null

          for ($i = 0; $i -lt 12; $i++) {
              $result = & $exe ip -4 2>$null

              if ($LASTEXITCODE -eq 0 -and $result) {
                  $candidate = ($result | Select-Object -First 1).Trim()

                  if ($candidate -match '^100\.') {
                      $ip = $candidate
                      break
                  }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $ip) {
              & $exe status
              throw 'No valid Tailscale IPv4 address assigned.'
          }

          "TAILSCALE_IP=$ip" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP: $ip"

      - name: Verify RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name TermService

          if ($service.Status -ne 'Running') {
              Start-Service -Name TermService
          }

          $listener = $null

          for ($i = 0; $i -lt 10; $i++) {
              $listener = Get-NetTCPConnection `
                -State Listen `
                -LocalPort 3389 `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $listener) {
              throw 'RDP is not listening on TCP port 3389.'
          }

          Write-Host 'RDP listener is active.'
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      - name: Publish Connection Details
        shell: pwsh
        run: |
          $summary = @"
          ## RDP Connection

          - Address: $env:TAILSCALE_IP
          - Username: RDP
          - Port: 3389
          - Password: Use the RDP_PASSWORD secret you configured.
          - Administrator: Enabled for RDP user.

          Your client must be authorized on the same Tailscale network.
          "@

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value $summary

          Write-Host 'RDP details published.'

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host 'RDP session is running.'
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host 'Username: RDP'
          Write-Host 'Password is stored in GitHub Secrets.'
          Write-Host 'RDP account has administrator group membership.'

          while ($true) {
              Start-Sleep -Seconds 60
          }
